version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: claim-review-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///claims.db
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
      - LOG_LEVEL=INFO
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads
    command: python run.py
    networks:
      - claim-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: claim-review-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    networks:
      - claim-network

networks:
  claim-network:
    driver: bridge
